<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Almost There ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
<style>

/* Background */

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Poppins',sans-serif;
background:radial-gradient(circle at center,#0f2027,#203a43,#2c5364);
overflow:hidden;
color:white;
}

/* glowing particles */

.particle{
position:absolute;
width:3px;
height:3px;
background:#00f7ff;
border-radius:50%;
opacity:0.7;
animation:float 10s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

/* glass card */

.card{
position:relative;
padding:50px;
border-radius:25px;
backdrop-filter:blur(25px);
background:rgba(255,255,255,0.08);
box-shadow:0 0 40px rgba(0,255,255,0.3);
text-align:center;
width:400px;
}

/* glowing rings */

.ring{
position:absolute;
border-radius:50%;
border:2px solid rgba(0,255,255,0.3);
animation:rotate 10s linear infinite;
}

.ring1{width:250px;height:250px;top:-80px;left:-80px;}
.ring2{width:300px;height:300px;bottom:-100px;right:-100px;animation-direction:reverse;}

@keyframes rotate{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

/* title */

h1{
font-size:2.5rem;
margin-bottom:10px;
}

/* typing text */

#typing{
min-height:40px;
font-size:1.2rem;
}

/* button */

button{
margin-top:30px;
padding:12px 30px;
border:none;
border-radius:30px;
background:linear-gradient(45deg,#00f7ff,#00c3ff);
color:black;
font-size:16px;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 20px rgba(0,255,255,0.7);
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 40px rgba(0,255,255,1);
}

/* glow pulse */

.pulse{
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 10px rgba(0,255,255,0.5);}
50%{box-shadow:0 0 40px rgba(0,255,255,1);}
100%{box-shadow:0 0 10px rgba(0,255,255,0.5);}
}

</style>
</head>

<body>

<div class="card">

<div class="ring ring1"></div>
<div class="ring ring2"></div>

<h1>💖 Ruko Jiiiiiiiii....</h1>

<div id="typing"></div>

<button class="pulse" onclick="goNext()">Enter the Surprise 🚀</button>

</div>

<script>

/* typing effect */

const text="❤️\nitna intezar kiya toda aur sahiii... ✨";

let i=0;

function typing(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(typing,40);

}

}

typing();

/* particles */

function createParticle(){

const p=document.createElement("div");
p.classList.add("particle");

p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(Math.random()*6+4)+"s";

document.body.appendChild(p);

setTimeout(()=>{p.remove();},10000);

}

setInterval(createParticle,150);

/* transition */

function goNext(){

document.body.innerHTML="<h1 style='text-align:center;'>❤️ Loading Love...</h1>";

setTimeout(()=>{
window.location.href="index2.html";
},1500);

}

</script>

</body>
</html>
