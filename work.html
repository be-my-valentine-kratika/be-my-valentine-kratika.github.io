<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine Kratika❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  
  font-family: 'Great Vibes', cursive;

  color: #ffffff;
  overflow: hidden;
  background: radial-gradient(circle at top, #ff9a9e, #fad0c4);
  
}
.kraks{
    height:100vh;
}
.card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  padding: 45px;
  width: 360px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  animation: pop 0.6s ease;
  z-index: 1;
}

@keyframes pop {
  from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
  to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

h1 {
  color: #e6005c;
  margin-bottom: 35px;
}

button {
  padding: 14px 30px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: #e6005c;
  color: white;
  box-shadow: 0 6px 15px rgba(230,0,92,0.4);
  transition: transform 0.2s;
}

#yes:hover {
  transform: scale(1.1);
}

#no {
  background: #ddd;
  color: #333;
  position: fixed;
  left: 60%;
  top: 60%;
  transition: left 0.05s linear, top 0.05s linear;
  z-index: 2;
}

/* Floating hearts */
.heart {
  position: fixed;
  bottom: -20px;
  animation: floatUp linear infinite;
  opacity: 0.7;
  pointer-events: none;
}

@keyframes floatUp {
  from { transform: translateY(0) scale(1); opacity: 1; }
  to { transform: translateY(-120vh) scale(1.6); opacity: 0; }
}
</style>
</head>

<body>
<section class="kraks">
<div class="card">
  <h1>Will you be my Valentine Kratika👉🏻👈🏻? ❤️</h1>
  <button id="yes">Yes 💖</button>
</div>

<button id="no">No </button>

<script>
const noBtn = document.getElementById("no");

// Move anywhere on screen
function dodge() {
  const b = noBtn.getBoundingClientRect();

  const maxX = window.innerWidth - b.width;
  const maxY = window.innerHeight - b.height;

  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top  = Math.random() * maxY + "px";
}

// Dodge when cursor within 50px
document.addEventListener("mousemove", (e) => {
  const b = noBtn.getBoundingClientRect();

  const btnX = b.left + b.width / 2;
  const btnY = b.top + b.height / 2;

  const dx = e.clientX - btnX;
  const dy = e.clientY - btnY;

  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance < 50) {
    dodge();
  }
});

// Mobile touch
noBtn.addEventListener("touchstart", dodge);

// Yes click
document.getElementById("yes").onclick = () => {
  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:radial-gradient(circle,#ff9a9e,#fad0c4);
      font-family: 'Great Vibes', cursive;
    ">
      <h1 style="color:#e6005c;font-size:42px;">
        <br>I Love You Forever 💘
      </h1>
    </div>
  `;
};

// Hearts
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "❤️";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = Math.random() * 22 + 14 + "px";
  h.style.animationDuration = Math.random() * 2 + 3 + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}, 250);
</script>
</section>

</body>
</html>
