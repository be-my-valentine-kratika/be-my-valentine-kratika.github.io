<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Love Gate ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Poppins',sans-serif;
background:radial-gradient(circle,#1b2735,#090a0f);
overflow:hidden;
color:white;
}

/* floating particles */

.particle{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
opacity:0.5;
animation:float 8s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

/* glass lock box */

.lock-box{
backdrop-filter:blur(20px);
background:rgba(255,255,255,0.08);
border-radius:25px;
padding:50px;
width:350px;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

/* lock icon */

.lock{
font-size:60px;
margin-bottom:20px;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%,100%{transform:scale(1);}
50%{transform:scale(1.2);}
}

/* input */

input{
width:80%;
padding:12px;
border:none;
border-radius:25px;
outline:none;
font-size:16px;
text-align:center;
background:rgba(255,255,255,0.15);
color:white;
}

/* button */

button{
margin-top:15px;
padding:10px 25px;
border:none;
border-radius:25px;
background:linear-gradient(45deg,#ff4e50,#ff6a88);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

/* error animation */

.shake{
animation:shake 0.4s;
}

@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-5px)}
50%{transform:translateX(5px)}
75%{transform:translateX(-5px)}
100%{transform:translateX(0)}
}

.message{
margin-top:15px;
color:#ff8a8a;
}

</style>
</head>

<body>

<div class="lock-box" id="box">

<div class="lock">🔒</div>

<h2>Secret Love Gate</h2>

<p>Enter the key to my heart ❤️</p>

<input type="password" id="password" placeholder="Enter our HASHTAG . . . .">

<br>

<button onclick="unlock()">Unlock</button>

<div class="message" id="msg"></div>

</div>

<script>

/* password */

const secret="kratyush";

/* unlock function */

function unlock(){

const pass=document.getElementById("password").value;
const box=document.getElementById("box");

if(pass===secret){

document.body.innerHTML="";

setTimeout(()=>{
window.location.href="index.html";
},1000);

}

else{

box.classList.add("shake");
document.getElementById("msg").innerHTML="Wrong password ❤️";

setTimeout(()=>{
box.classList.remove("shake");
},500);

}

}

/* particles */

function createParticle(){

const p=document.createElement("div");
p.classList.add("particle");

p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(Math.random()*5+3)+"s";

document.body.appendChild(p);

setTimeout(()=>{
p.remove();
},8000);

}

setInterval(createParticle,200);

</script>

</body>
</html>
